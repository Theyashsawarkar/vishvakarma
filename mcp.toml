# Vayu's MCP servers, given to every agent `vishvakarma sync` finds (only the
# ones whose command is installed). Add or override yours in
# ~/.config/vishvakarma/mcp.toml; `enabled = false` leaves one out.
# "{agent}" in args or env becomes the agent's name (claude, codex, ...).

[servers.dvarapala]
description = "Run commands as root (or as you, outside your sandbox) after the user approves each one: request_root_commands"
command = "dvarapala"
args = ["--mcp"]

[servers.darshan]
description = "Show the user PDFs, images and Markdown in their terminal, find files by name across the system, and answer what they ask about what they're reading"
command = "darshan"
args = ["mcp"]

[servers.ekatva]
description = "The user's phone: status, ring, lock, SMS and calls (asks the user first), its clipboard and files, keeping the laptop awake"
command = "ekatva"
args = ["mcp"]
env = { EKATVA_AGENT = "{agent}" }

[servers.vaikhari]
description = "Posts to the user's X and LinkedIn: check a text against each network, draft, and propose posts (every one waits for the user's approval; X needs their click)"
command = "vaikhari"
args = ["mcp", "--requester", "{agent}"]

[servers.narada]
description = "The user's Gmail and Google Chat: list, search, read, draft and send (sends ask the user first; html for tables)"
command = "narada"
args = ["mcp"]

[servers.sangam]
description = "The user's GitHub pull requests: list, read, diff; comment, review and merge after the user approves"
command = "sangam"
args = ["mcp"]
