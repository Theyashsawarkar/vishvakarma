# Copy to ~/.config/vishvakarma/job-hunt.toml and change what differs for you.
# Everything here is optional: without it the skill works out roles and skills from the resume.

# Where the resume, the applied and shown lists, the profile and the reports live.
data_dir = "~/Documents/job-hunt"

# The job boards searched each run, in this order (all nine by default; drop the ones that don't fit).
# Each is used signed in, in the Chrome the skill works in.
# sites = ["linkedin", "indeed", "naukri", "hirist", "cutshort", "wellfound", "internshala", "foundit", "instahyre"]
# The boards where the signed-in account is the candidate's own (their resume), so the board's own
# picks for that profile (Instahyre's Opportunities, Naukri's recommended jobs...) are theirs.
# candidate_accounts = []

# What to search for. Empty: taken from the resume's profile.
# roles = ["Backend Engineer", "Node.js Developer"]
# locations = ["Pune, Maharashtra, India", "India"]
# workplace = ["remote", "hybrid"]          # any of onsite, remote, hybrid
# experience = ["associate", "mid-senior"]  # internship, entry, associate, mid-senior, director, executive
# posted_within_days = 7                    # 1, 7 or 30
# easy_apply_only = false

# Never show jobs from these (current employer, places you've ruled out).
# exclude_companies = ["Current Employer"]
# exclude_title_words = ["intern", "principal"]

# How much one run does. Every board watches for automated browsing, so keep these modest.
# max_jobs_opened = 25      # job pages read in one run, shared across the boards
# show_top = 10             # jobs in the report
# min_score = 60            # below this a job is left out
