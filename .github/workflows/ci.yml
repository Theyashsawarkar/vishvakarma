name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Lint
        run: pipx run ruff check .
      - name: Compile
        run: python -m py_compile bin/vishvakarma vishvakarma/*.py skills/*/scripts/*.py
      - name: ShellCheck
        run: shellcheck -S warning install.sh
      - name: Version and changelog agree
        run: |
          v=$(sed -n 's/^VERSION = "\(.*\)"/\1/p' vishvakarma/__init__.py)
          grep -q "^## v$v " CHANGELOG.md || { echo "CHANGELOG.md has no entry for v$v"; exit 1; }
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Keys match the keymap, and the README lists them
        run: |
          python3 scripts/keybinds.py --check
          keys=$(grep -o '^# keybind: Vishvakarma/app:normal | [^|]*' vishvakarma/tui.py | sed 's/.*| //; s/ *$//')
          [ -n "$keys" ] || { echo "no keybind lines found"; exit 1; }
          printf '%s\n' "$keys" | while read -r k; do
            grep -qF "\`$k\`" README.md || grep -qF "\`${k// /}\`" README.md || { echo "README doesn't document $k"; exit 1; }
          done
      - name: Commands work in an empty home
        run: |
          export HOME=$(mktemp -d)
          bin/vishvakarma --version
          bin/vishvakarma help >/dev/null
          bin/vishvakarma
          bin/vishvakarma sync -n
          bin/vishvakarma doctor || true
      - name: Website is up to date
        run: python3 scripts/site.py --check
